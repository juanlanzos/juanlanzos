# Sube el Sudoku a Cloudflare (sudoku.habi.ar) cada vez que cambia la carpeta sudoku/
name: Subir Sudoku a Cloudflare

on:
  push:
    paths:
      - "sudoku/**"
      - ".github/workflows/deploy-sudoku.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Falta configurar la clave de Cloudflare
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::Agregá CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID en Settings > Secrets and variables > Actions para poder subir el Sudoku."

      - name: Subir Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: sudoku
        run: npx -y wrangler@3.114.0 deploy
